plugins { id 'com.android.application' }
android {
 namespace 'br.com.atlas.sst.homologacao'
 compileSdk 35
 defaultConfig {
  applicationId 'br.com.atlas.sst.homologacao'
  minSdk 29
  targetSdk 35
  versionCode 1
  versionName '0.1.0-homologacao'
  testInstrumentationRunner 'android.test.InstrumentationTestRunner'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { jniLibs.srcDirs 'src/main/addons', 'libs/bare-kit/jni' } }
 packaging { jniLibs { useLegacyPackaging = false } }
 buildTypes { debug { debuggable true } }
}
dependencies {
 implementation fileTree(dir:'libs',include:['bare-kit/classes.jar'])
 implementation 'androidx.webkit:webkit:1.12.1'
}
