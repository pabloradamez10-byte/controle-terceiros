server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/sst;
    include /srv/sst/csp.nginx.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 2m;
    # The gateway is on a private Docker network; no Studio or SQL route is exposed.
    location ~ ^/backend/(?<api_path>(auth/v1|rest/v1|storage/v1|functions/v1)/.*)$ {
        resolver 127.0.0.11 valid=30s;
        set $sst_gateway kong:8000;
        proxy_pass http://$sst_gateway/$api_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
    }
    location /backend/ { return 404; }
    location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
    location ~ \.wasm$ { default_type application/wasm; try_files $uri =404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
