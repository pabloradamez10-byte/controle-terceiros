name: Build APK 0.2.1 homologacao

on:
  push:
    branches:
      - homologacao/p2p-local-first
    paths:
      - .github/workflows/build-apk-0.2.0-homologacao.yml

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao/p2p-local-first
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install native build utility
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Install dependencies
        run: npm ci && npm ci --prefix android
      - name: Fetch Android Bare kit
        run: python3 android/scripts/fetch-kit.py
      - name: Fetch verified OCR assets
        run: python3 deploy/internal/download-assets.py "$RUNNER_TEMP/sst-ocr-assets"
      - name: Build Android UI and core bundle
        env:
          SST_OCR_ASSETS: ${{ runner.temp }}/sst-ocr-assets
        run: node android/scripts/prepare.cjs
      - name: Link and verify native addons
        run: node android/scripts/link-addons.cjs && node android/scripts/check-addons.cjs
      - name: Assemble test APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/SST-Manager-0.2.1-homologacao.apk
          sha256sum dist-apk/SST-Manager-0.2.1-homologacao.apk > dist-apk/SST-Manager-0.2.1-homologacao.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SST-Manager-0.2.1-homologacao
          path: dist-apk/
          if-no-files-found: error
          retention-days: 14
