name: Sync generated homologacao

on:
  push:
    branches:
      - homologacao/p2p-local-first
    paths:
      - .github/workflows/sync-generated-homologacao.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao/p2p-local-first
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ensure source terminator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/features/pendencias/base.js')
          data = p.read_bytes()
          if data and not data.endswith(b'\n'):
              p.write_bytes(data + b'\n')
          PY
      - run: npm run build
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/pendencias/base.js assets/js/core.js index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: sincroniza Central de Pendências [skip ci]"
          git push origin HEAD:homologacao/p2p-local-first
