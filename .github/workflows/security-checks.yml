name: SST security regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 deploy/internal/download-assets.py "$RUNNER_TEMP/sst-ocr-assets"
      - run: npm run build
      - run: git diff --exit-code
      - run: npm test
        env:
          SST_TEST_DHT: '1'
          SST_TEST_OCR_ASSETS: ${{ runner.temp }}/sst-ocr-assets
